name: publish-site

# Disparado pelo botão Publicar (API → S3 → Lambda PublishDispatcher → repository_dispatch),
# por mudanças no código do site ou manualmente.
on:
  repository_dispatch:
    types: [publish-site]
  push:
    branches: [main, master]
    paths: ["frontend/projects/site/**", "frontend/projects/shared/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Baixar conteúdo publicado
        run: aws s3 cp "s3://${{ vars.SNAPSHOT_BUCKET }}/snapshot.json" projects/site/src/content/snapshot.json

      - name: Build estático (prerender)
        run: npx ng build site

      - name: Publicar no S3
        run: |
          # Assets com hash: cache longo. HTML: sempre revalidar.
          aws s3 sync dist/site/browser "s3://${{ vars.SITE_BUCKET }}" --delete \
            --exclude "*.html" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist/site/browser "s3://${{ vars.SITE_BUCKET }}" --delete \
            --exclude "*" --include "*.html" --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidar CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.SITE_DISTRIBUTION_ID }}" --paths "/*" > /dev/null
